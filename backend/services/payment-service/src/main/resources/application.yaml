server:
  port: 9002
  servlet:
    context-path: /api
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_service
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
app:
  payment:
    stripe:
      # Khóa test mode (sk_test_...) và signing secret của webhook (whsec_...). Chỉ lấy từ môi trường.
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Stripe redirect buyer về {frontend-base-url}/orders/{orderId}?payment=success|cancelled
    frontend-base-url: ${FRONTEND_ORIGIN:http://localhost:3000}
