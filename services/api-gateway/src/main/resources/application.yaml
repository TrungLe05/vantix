spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        globalcors:
          cors-configurations:
            '[/**]':
              allowed-origins:
                - ${FRONTEND_ORIGIN}   # origin cụ thể, không dùng "*" vì có allow-credentials
              allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
              allowed-headers: "*"
              allow-credentials: true  # bắt buộc để trình duyệt gửi/nhận cookie refreshToken
              max-age: 3600
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:9004
              predicates:
                - Path=/api/users/**,/api/auth/**,/api/oauth2/**,/api/login/oauth2/**

            - id: product-service
              uri: http://localhost:9003
              predicates:
                - Path=/api/products/**,/api/events/**, /api/venues/**, /api/ticket-types/**

            - id: order-service
              uri: http://localhost:9001
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: http://localhost:9002
              predicates:
                - Path=/api/payments/**

            - id: notification-service
              uri: http://localhost:9000
              predicates:
                - Path=/api/notifications/**

            - id: bot-detection-service
              uri: http://localhost:9005
              predicates:
                - Path=/api/bot-detection/**

            - id: assistant-service
              uri: http://localhost:9006
              predicates:
                - Path=/api/assistant/**
server:
  port: 8999
app:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 15m
    expiration-refresh: 7d
  gateway:
    public-endpoints:
      - POST /api/auth/register
      - POST /api/auth/verify-email
      - POST /api/auth/resend-verification
      - POST /api/auth/login
      - POST /api/auth/oauth2/exchange
      - POST /api/auth/refresh
      - POST /api/auth/forgot-password
      - POST /api/auth/reset-password
      - GET /api/oauth2/authorization/**
      - GET /api/login/oauth2/code/**
      - GET /api/*/health
      - GET /api/venues
      - GET /api/events
      - GET /api/events/*
      - GET /api/events/*/seat-map
    password-change-allowlist:
      - PATCH /api/auth/change-password
      - POST /api/auth/logout
      - GET /api/users/me
logging:
  level:
    com.dev.api_gateway: DEBUG