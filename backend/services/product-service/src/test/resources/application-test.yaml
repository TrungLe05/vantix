# Profile integration test (D21): PostgreSQL thật, DB riêng products_service_test
# (tạo bởi docker/postgres/test/create-test-databases.sql), không đụng DB dev.
spring:
  datasource:
    url: jdbc:postgresql://${IT_DB_HOST:localhost}:${IT_DB_PORT:5432}/products_service_test
    username: ${IT_DB_USER:vantix_test}
    password: ${IT_DB_PASSWORD:vantix_test}
  data:
    redis:
      host: ${IT_REDIS_HOST:localhost}
      port: ${IT_REDIS_PORT:6379}
      database: 15
  # Không trỏ vào Kafka dev: test không được phát event lên topic thật
  kafka:
    bootstrap-servers: localhost:1
app:
  outbox:
    initial-delay-ms: 3600000
    poll-interval-ms: 3600000
