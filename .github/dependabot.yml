version: 2

updates:
  # Maven (backend)
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # Spring Boot / Spring Cloud đã chốt phiên bản theo docs/P0; nâng major phải làm tay
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major"]

  # npm (frontend)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Phiên bản action trong workflow (CI luôn dùng tag nên cần Dependabot theo dõi)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  # Docker base image (bỏ comment khi đã có Dockerfile)
