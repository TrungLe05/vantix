server:
  port: 9004
  servlet:
    context-path: /api
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/users_service
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration