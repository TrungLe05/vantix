# =====================================================================
# CD — ĐANG TẮT (chưa có server). File nằm ở .github/workflows-disabled/
# nên GitHub KHÔNG chạy. Khi có server: chuyển file vào .github/workflows/,
# bỏ comment, rồi thay các giá trị <...>.
#
# Luồng: tag vX.Y.Z -> build image từng service -> push GHCR -> SSH vào VPS
#        -> docker compose pull && up -d (chờ duyệt thủ công qua Environment).
#
# Cần chuẩn bị trước:
#   1. Mỗi service có Dockerfile (hiện chỉ mới có khung, cần viết trước P9).
#   2. docker-compose.prod.yml trên server, image trỏ tới ghcr.io/<owner>/vantix-<service>.
#   3. Settings > Environments > tạo "production", bật Required reviewers.
#   4. Secrets của environment production: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.
# =====================================================================

