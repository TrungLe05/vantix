server:
  port: 9000
  servlet:
    context-path: /api
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_service
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  # SMTP chỉ bật khi có MAIL_HOST: thiếu thì không có JavaMailSender, email được đánh dấu SKIPPED
  # (thông báo trong ứng dụng vẫn hoạt động)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 2000
            readTimeout: 3000
# Không để health check mở kết nối SMTP mỗi lần gọi /actuator/health: SMTP lỗi không làm service DOWN
# vì thông báo trong ứng dụng vẫn chạy và email đã có cơ chế retry riêng
management:
  health:
    mail:
      enabled: false
app:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:9004/api}
  notification:
    mail-from: ${MAIL_FROM:no-reply@vantix.local}
    # Link trong email và Origin được phép mở WebSocket
    frontend-base-url: ${FRONTEND_ORIGIN:http://localhost:3000}
