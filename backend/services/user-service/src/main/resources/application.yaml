server:
  port: 9004
  servlet:
    context-path: /api
  forward-headers-strategy: framework
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/users_service
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
app:
  otp:
    hmac-secret: ${OTP_HMAC_SECRET}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 15m
    expiration-refresh: 7d
  cookie:
    secure: true
    same-site: None
  oauth2:
    frontend-callback-url: ${FRONTEND_CALLBACK_URL}
  run-config:
    default-admin:
      username: ${DEFAULT_ADMIN_USER_NAME}
      password: ${DEFAULT_ADMIN_PASSWORD}
    default-staff:
      username: ${DEFAULT_STAFF_USER_NAME}
      password: ${DEFAULT_ADMIN_PASSWORD}